[project]
name = "call-me-maybe"
version = "0.1.0"
description = "LLM function calling project"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_me_maybe"]
